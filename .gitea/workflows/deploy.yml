# ============================================================
# SparkArc Gitea Actions — 自动构建 & 部署
# ============================================================
# 触发条件: push 到 main 分支
# 运行环境: act_runner (Docker 模式，挂载宿主机 Docker Socket)
# ============================================================

name: Build & Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: sh
    env:
      # 镜像和容器命名
      IMAGE_TAG: "sparkarc:local"
      CONTAINER_NAME: "sparkarc"
      # 数据卷命名
      VOL_DATA: "sparkarc_data"
      VOL_USERDATA: "sparkarc_userdata"
      VOL_SHARES: "sparkarc_shares"
      VOL_LLM_CONFIG: "sparkarc_llm_config"
      VOL_RUNTIME_CACHE: "sparkarc_runtime_cache"

    steps:
      # ========================================
      # Step 1: 检出代码
      # ========================================
      - name: 📥 检出代码
        shell: sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITEA_TOKEN: ${{ gitea.token }}
          GITEA_INTERNAL_SERVER_URL: http://gitea:3000
        run: |
          set -eu
          echo "📥 使用 git 检出代码（无 Node 依赖）..."
          apk add --no-cache git

          TOKEN="${GITEA_TOKEN:-${GITHUB_TOKEN:-}}"
          PUBLIC_REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          if [ -n "${GITEA_INTERNAL_SERVER_URL:-}" ]; then
            REPO_URL="${GITEA_INTERNAL_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          else
            REPO_URL="$PUBLIC_REPO_URL"
          fi

          if [ -d .git ]; then
            git remote set-url origin "$REPO_URL" || true
          else
            git init .
            git remote add origin "$REPO_URL"
          fi

          # 同机检出固定走 Gitea Docker 内网；HTTP/1.1 同时规避公网回退时的 HTTP/2 断流。
          git config http.version HTTP/1.1

          fetch_repository() {
            fetch_url="$1"
            attempt=1
            git remote set-url origin "$fetch_url"

            while [ "$attempt" -le 3 ]; do
              echo "📡 拉取代码（第 ${attempt}/3 次）：${fetch_url}"
              if [ -n "$TOKEN" ]; then
                if git -c http.extraHeader="Authorization: token ${TOKEN}" fetch --depth=1 --no-tags origin "$GITHUB_SHA"; then
                  return 0
                fi
              elif git fetch --depth=1 --no-tags origin "$GITHUB_SHA"; then
                return 0
              fi

              attempt=$((attempt + 1))
              [ "$attempt" -le 3 ] && sleep $((attempt * 3))
            done

            return 1
          }

          if ! fetch_repository "$REPO_URL"; then
            if [ "$REPO_URL" = "$PUBLIC_REPO_URL" ]; then
              echo "❌ 代码检出失败"
              exit 1
            fi

            echo "⚠️ Gitea 内网检出失败，回退到公网地址"
            fetch_repository "$PUBLIC_REPO_URL"
          fi

          git checkout --force FETCH_HEAD
          git submodule update --init --recursive || true
          echo "✅ 代码检出完成"

      # ========================================
      # Step 2: 构建 Docker 镜像
      # ========================================
      # 利用 BuildKit 进行构建，DOCKER_BUILDKIT=1 启用高级缓存
      # Dockerfile 中的 --mount=type=cache 会将 npm/pip 缓存
      # 持久化在宿主机 Docker 的 overlay 层中，跨次构建复用
      # 代码变更时 COPY 指令会自动失效对应缓存层，确保更新不受影响
      # ========================================
      - name: 🔨 构建镜像
        shell: sh
        run: |
          echo "🔨 开始构建镜像..."
          set -eu
          DOCKER_BUILDKIT=1 docker build -t $IMAGE_TAG .
          echo "✅ 镜像构建完成"

      # ========================================
      # Step 3: 镜像运行时烟测
      # ========================================
      # 在替换线上容器前验证根配置已进入镜像，且依赖该配置的模块可以导入。
      # ========================================
      - name: 🧪 验证镜像运行时
        shell: sh
        run: |
          docker run --rm --entrypoint python "$IMAGE_TAG" -c \
            "from pathlib import Path; assert Path('/app/sparkarc.json').is_file(); from core.network_probe import get_hf_candidates; print('✅ 镜像运行时验证通过')"

      # ========================================
      # Step 4: 部署
      # ========================================
      - name: 🚀 部署应用
        shell: sh
        env:
          LLM_KEY: ${{ secrets.LLM_KEY }}
          SPARKARC_REGISTRATION_VERIFICATION_ENABLED: ${{ secrets.SPARKARC_REGISTRATION_VERIFICATION_ENABLED }}
          SPARKARC_REGISTRATION_VERIFICATION_PROVIDER: ${{ secrets.SPARKARC_REGISTRATION_VERIFICATION_PROVIDER }}
          SPARKARC_TURNSTILE_SITE_KEY: ${{ secrets.SPARKARC_TURNSTILE_SITE_KEY }}
          SPARKARC_TURNSTILE_SECRET_KEY: ${{ secrets.SPARKARC_TURNSTILE_SECRET_KEY }}
          SPARKARC_USERS_DATABASE_URL: ${{ secrets.SPARKARC_USERS_DATABASE_URL }}
          AGENT_MATCHBOX_DATABASE_URL: ${{ secrets.AGENT_MATCHBOX_DATABASE_URL }}
          SPARKARC_DATABASE_NETWORK: ${{ secrets.SPARKARC_DATABASE_NETWORK }}
          SPARKARC_POSTGRES_URL: ${{ secrets.SPARKARC_POSTGRES_URL }}
          SPARKARC_POSTGRES_HOST: ${{ secrets.SPARKARC_POSTGRES_HOST }}
          SPARKARC_POSTGRES_PORT: ${{ secrets.SPARKARC_POSTGRES_PORT }}
          SPARKARC_POSTGRES_USER: ${{ secrets.SPARKARC_POSTGRES_USER }}
          SPARKARC_POSTGRES_PASSWORD: ${{ secrets.SPARKARC_POSTGRES_PASSWORD }}
          SPARKARC_DATABASE_PREFIX: ${{ secrets.SPARKARC_DATABASE_PREFIX }}
          SPARKARC_EXA_MCP_URL: ${{ secrets.SPARKARC_EXA_MCP_URL }}
          SPARKARC_EXA_API_KEY: ${{ secrets.SPARKARC_EXA_API_KEY }}
          SPARKARC_TAVILY_MCP_URL: ${{ secrets.SPARKARC_TAVILY_MCP_URL }}
          SPARKARC_TAVILY_API_KEY: ${{ secrets.SPARKARC_TAVILY_API_KEY }}
        run: |
          echo "🚀 开始部署..."
          set -eu

          # 创建所有数据卷（已存在则跳过）
          docker volume create $VOL_DATA || true
          docker volume create $VOL_USERDATA || true
          docker volume create $VOL_SHARES || true
          docker volume create $VOL_LLM_CONFIG || true
          docker volume create $VOL_RUNTIME_CACHE || true

          # 保留站点已配置的数据库连接与网络，避免重建后静默退回 SQLite。
          # 只读取数据库变量；不要打印完整容器环境，里面可能包含密钥。
          DATABASE_NETWORK="${SPARKARC_DATABASE_NETWORK:-}"
          if docker inspect "$CONTAINER_NAME" >/dev/null 2>&1; then
            if [ -z "$DATABASE_NETWORK" ]; then
              DATABASE_NETWORK=$(docker inspect --format '{{.HostConfig.NetworkMode}}' "$CONTAINER_NAME")
            fi
            DATABASE_ENV=$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$CONTAINER_NAME")
            # 共用连接的显式选择不继承单库覆盖，避免继续指向另一个服务。
            if [ -z "${SPARKARC_POSTGRES_URL:-}" ] && [ -z "${SPARKARC_POSTGRES_HOST:-}" ]; then
              if [ -z "${SPARKARC_USERS_DATABASE_URL:-}" ]; then
                SPARKARC_USERS_DATABASE_URL=$(printf '%s\n' "$DATABASE_ENV" | sed -n 's/^SPARKARC_USERS_DATABASE_URL=//p')
              fi
              if [ -z "${AGENT_MATCHBOX_DATABASE_URL:-}" ]; then
                AGENT_MATCHBOX_DATABASE_URL=$(printf '%s\n' "$DATABASE_ENV" | sed -n 's/^AGENT_MATCHBOX_DATABASE_URL=//p')
              fi
              SPARKARC_POSTGRES_URL=$(printf '%s\n' "$DATABASE_ENV" | sed -n 's/^SPARKARC_POSTGRES_URL=//p')
              SPARKARC_POSTGRES_HOST=$(printf '%s\n' "$DATABASE_ENV" | sed -n 's/^SPARKARC_POSTGRES_HOST=//p')
              if [ -z "${SPARKARC_POSTGRES_PORT:-}" ]; then
                SPARKARC_POSTGRES_PORT=$(printf '%s\n' "$DATABASE_ENV" | sed -n 's/^SPARKARC_POSTGRES_PORT=//p')
              fi
              if [ -z "${SPARKARC_POSTGRES_USER:-}" ]; then
                SPARKARC_POSTGRES_USER=$(printf '%s\n' "$DATABASE_ENV" | sed -n 's/^SPARKARC_POSTGRES_USER=//p')
              fi
              if [ -z "${SPARKARC_POSTGRES_PASSWORD:-}" ]; then
                SPARKARC_POSTGRES_PASSWORD=$(printf '%s\n' "$DATABASE_ENV" | sed -n 's/^SPARKARC_POSTGRES_PASSWORD=//p')
              fi
            fi
            if [ -z "${SPARKARC_DATABASE_PREFIX:-}" ]; then
              SPARKARC_DATABASE_PREFIX=$(printf '%s\n' "$DATABASE_ENV" | sed -n 's/^SPARKARC_DATABASE_PREFIX=//p')
            fi
            unset DATABASE_ENV
          fi
          DATABASE_NETWORK="${DATABASE_NETWORK:-bridge}"

          # 停止并删除旧容器
          docker rm -f $CONTAINER_NAME || true

          # 启动新容器
          # ⚠️ 挂载目录中的受管文件会在启动时由 docker-entrypoint.sh 自动同步
          docker run -d \
            --name $CONTAINER_NAME \
            --network "$DATABASE_NETWORK" \
            --add-host host.docker.internal:host-gateway \
            -p 7788:6688 \
            -e LLM_KEY \
            -e SPARKARC_POSTGRES_URL="${SPARKARC_POSTGRES_URL:-}" \
            -e SPARKARC_POSTGRES_HOST="${SPARKARC_POSTGRES_HOST:-}" \
            -e SPARKARC_POSTGRES_PORT="${SPARKARC_POSTGRES_PORT:-5432}" \
            -e SPARKARC_POSTGRES_USER="${SPARKARC_POSTGRES_USER:-sparkarc}" \
            -e SPARKARC_POSTGRES_PASSWORD="${SPARKARC_POSTGRES_PASSWORD:-}" \
            -e SPARKARC_DATABASE_PREFIX="${SPARKARC_DATABASE_PREFIX:-sparkarc}" \
            -e SPARKARC_USERS_DATABASE_URL="$SPARKARC_USERS_DATABASE_URL" \
            -e AGENT_MATCHBOX_DATABASE_URL="$AGENT_MATCHBOX_DATABASE_URL" \
            -e SPARKARC_EXA_MCP_URL \
            -e SPARKARC_EXA_API_KEY \
            -e SPARKARC_TAVILY_MCP_URL \
            -e SPARKARC_TAVILY_API_KEY \
            -e SPARKARC_REGISTRATION_VERIFICATION_ENABLED="${SPARKARC_REGISTRATION_VERIFICATION_ENABLED}" \
            -e SPARKARC_REGISTRATION_VERIFICATION_PROVIDER="${SPARKARC_REGISTRATION_VERIFICATION_PROVIDER}" \
            -e SPARKARC_TURNSTILE_SITE_KEY="${SPARKARC_TURNSTILE_SITE_KEY}" \
            -e SPARKARC_TURNSTILE_SECRET_KEY="${SPARKARC_TURNSTILE_SECRET_KEY}" \
            -e SPARKARC_RUNTIME_CACHE_DIR="/app/server/.runtime" \
            -v $VOL_DATA:/app/server/data \
            -v $VOL_USERDATA:/app/server/_userdata \
            -v $VOL_SHARES:/app/server/shares_data \
            -v $VOL_LLM_CONFIG:/app/server/llm/agen_matchbox \
            -v $VOL_RUNTIME_CACHE:/app/server/.runtime \
            --restart unless-stopped \
            $IMAGE_TAG

          # 等待容器启动并验证
          HEALTHY=0
          for attempt in $(seq 1 60); do
            if docker exec "$CONTAINER_NAME" python -c "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:6688/health', timeout=3).read().strip() == b'sparkarc-ok'" >/dev/null 2>&1; then
              HEALTHY=1
              break
            fi
            sleep 2
          done
          if [ "$HEALTHY" -ne 1 ]; then
            echo "应用健康检查失败，请检查容器日志和数据库连接"
            exit 1
          fi
          echo "✅ 部署完成！访问 http://localhost:7788"

      # ========================================
      # Step 5: 清理
      # ========================================
      - name: 🧹 清理悬空镜像
        shell: sh
        run: docker image prune -f || true

